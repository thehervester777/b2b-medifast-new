<!doctype html>
<html lang="en" data-layout="boot">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1a3d" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="MediFast Admin. Review supplier quotes, manage pharmacy requests and verify suppliers." />
    <title>MediFast Admin</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* Shown before the stylesheet loads, so there is never a blank flash. */
      html, body { background: #f4f7fc; margin: 0; }
      #boot { position: fixed; inset: 0; z-index: 999; display: grid; place-items: center; background: #fff; transition: opacity 0.35s, visibility 0.35s; }
      #boot.gone { opacity: 0; visibility: hidden; }
      #boot span { font: 800 24px/1 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; letter-spacing: -0.025em; color: #0c1a3d; animation: bootpulse 1.1s ease-in-out infinite; }
      #boot b { margin-left: 0.28em; font-weight: 600; color: #2358e6; }
      @keyframes bootpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span>MediFast<b>Admin</b></span></div>

    <div id="auth" class="auth-root" hidden></div>
    <div id="shell" class="shell-root" hidden></div>
    <div id="layer" class="layer"></div>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <noscript>MediFast Admin needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
