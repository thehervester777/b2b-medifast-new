<!doctype html>
<html lang="en" data-layout="boot">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="MediFast Supplier. Quote on live pharmacy requests and send your prices in one tap." />
    <title>MediFast Supplier</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* Inline first-paint styles: the splash shows before any bundle has loaded. */
      html,body{margin:0;background:#f5f8fe}
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:999;transition:opacity .35s ease,visibility .35s}
      #boot.gone{opacity:0;visibility:hidden}
      #boot span{font:800 24px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.025em;color:#0c1a3d;animation:bootpulse 1.1s ease-in-out infinite}
      #boot b{margin-left:.28em;font-weight:600;color:#2358e6}
      @keyframes bootpulse{0%,100%{opacity:1}50%{opacity:.45}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <span>MediFast<b>Supplier</b></span>
    </div>

    <div id="auth" class="auth-root" hidden></div>
    <div id="shell" class="shell-root" hidden></div>
    <div id="layer" class="layer"></div>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <noscript>MediFast Supplier needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
