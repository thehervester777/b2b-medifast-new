<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set up MediFast</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f7f6; --card:#fff; --ink:#10201d; --mute:#5b6b67; --line:#d6e0dd; --accent:#0b7a63; --accent-ink:#fff; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1614; --card:#16211e; --ink:#e8f1ee; --mute:#9db0aa; --line:#2a3a36; --accent:#3fc7a4; --accent-ink:#06231b; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  h1 { margin:0 0 6px; font-size:1.4rem; }
  p { margin:0 0 20px; color:var(--mute); }
  label { display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  small { display:block; margin-top:6px; color:var(--mute); }
  button { width:100%; margin-top:22px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:700; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  #err { margin-top:14px; color:var(--err); min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>Welcome to MediFast</h1>
  <p>Create the Owner account. This page works once and then disappears.</p>
  <form id="f" novalidate>
    <label for="name">Your name</label>
    <input id="name" name="name" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocomplete="new-password" minlength="10" required>
    <small>At least 10 characters.</small>
    <label for="pw2">Repeat password</label>
    <input id="pw2" name="pw2" type="password" autocomplete="new-password" required>
    <div id="err" role="alert"></div>
    <button id="go" type="submit">Create Owner account</button>
  </form>
</main>
<script src="/setup.js"></script>
</body>
</html>
